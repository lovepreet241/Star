<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Space ID Mining</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#05060b;--cy:#38bdf8;--cy2:#0ea5e9;--eth:#8b6cf0;--ok:#4ade80;--mut:#8b8fa6;--bd:#123a57;--card:#03050a;--slate:#2b2b40;--accent-yellow:#f5a623}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:var(--bg);color:#fff;font-family:Inter,Roboto,system-ui,sans-serif;overflow:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;height:100%;max-width:480px;margin:auto;display:flex;flex-direction:column;z-index:1}
.view{display:none;flex:1;min-height:0;flex-direction:column;padding:14px 14px 0;overflow-y:auto}
.view>*{flex-shrink:0}.view.on{display:flex}.view::-webkit-scrollbar{display:none}
svg{flex:none}

/* header */
.hd{display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:50%;background:#26263a;display:grid;place-items:center;font-weight:700;overflow:hidden;color:var(--cy);flex:none}
.hd .nm{font-size:16px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;display:flex;align-items:center;gap:6px}
.hd .id{font-size:12px;color:var(--mut)}
.admin-badge{background:#ff4757;color:#fff;font-size:9px;padding:2px 6px;border-radius:6px;font-weight:900;cursor:pointer;letter-spacing:0.5px}
.wp{margin-left:auto;display:flex;align-items:center;gap:10px;padding:6px 12px 6px 7px;border-radius:99px;border:1px solid #1d2a3d;background:rgba(5,8,14,.7);cursor:pointer}
.eth{width:30px;height:30px;border-radius:50%;background:#1b1b33;display:grid;place-items:center}
.wp small{display:block;font-size:9.5px;letter-spacing:2.2px;color:var(--mut);font-weight:500}
.wp b{font-size:15px;font-weight:700}.wp b i{font-style:normal;color:var(--eth);margin-left:3px}
.wp .chev{color:var(--mut)}

/* balance */
.bal{text-align:center;margin-top:16px}
.bal b{font-size:min(9.4vw,44px);font-weight:800;letter-spacing:-.5px}
.bal b i{font-style:normal;color:var(--cy);margin-left:6px}
.bal .u{color:var(--ok);font-size:16px;font-weight:600;margin-top:4px}

/* mid */
.mid{position:relative;flex:1;min-height:240px}
.daily{position:absolute;left:0;top:8px;width:64px;padding:9px 0 8px;border-radius:15px;border:1.5px solid #14527a;background:rgba(6,16,28,.85);box-shadow:0 0 18px rgba(14,165,233,.25);text-align:center;font-size:11px;font-weight:700;line-height:1.15;cursor:pointer;z-index:10}
.daily svg{width:30px;height:30px;display:block;margin:0 auto 3px}
.daily:after{content:"";position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:#f43f5e;border:2px solid var(--bg)}
.daily.no:after{display:none}

.coinw{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.coin{pointer-events:auto;width:min(56vw,280px);aspect-ratio:1;border-radius:50%;position:relative;display:grid;place-items:center;background:#202024;box-shadow:0 0 0 1px #0b1a28,0 0 60px rgba(14,165,233,.42),0 0 130px rgba(14,165,233,.16);transition:transform .07s;touch-action:manipulation;cursor:pointer}
.coin:before{content:"";position:absolute;inset:7%;border-radius:50%;background:#111116;border:2px solid #2b2b31}
.coin img{position:relative;width:82%;height:82%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 4px 18px rgba(255,100,70,.35))}
.coin.p{transform:scale(.965)}

.fl{position:fixed;font-weight:800;font-size:26px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:none;z-index:90;animation:up 0.9s ease-out forwards}
@keyframes up{to{transform:translateY(-65px);opacity:0}}

.pill{align-self:center;margin:12px 0 10px;padding:10px 24px;border-radius:99px;background:#1b1c2d;border:1.5px solid #2c3a57;font-size:16px;font-weight:600;display:flex;align-items:center;gap:9px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{height:54px;border-radius:18px;border:1.5px solid #17324d;background:rgba(3,6,12,.85);display:flex;align-items:center;justify-content:center;gap:9px;font-size:20px;font-weight:700}
.box svg{width:24px;height:24px}.box.rd{color:var(--ok)}
#cd{font-size:20px;line-height:1.2;text-align:center}
.bar{height:9px;border-radius:9px;background:#26273a;margin:12px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;min-width:0;border-radius:9px;background:var(--cy);transition:width .2s}

/* pages */
.pt{text-align:center;font-size:28px;font-weight:800;letter-spacing:.5px;margin:15px 0 18px}
h1{font-size:30px;font-weight:800;margin:15px 0 6px}.sub{color:var(--mut);font-size:15px;margin-bottom:18px}
.card{border:1.5px solid var(--bd);background:var(--card);border-radius:24px;padding:16px;margin-bottom:12px;box-shadow:0 0 28px rgba(14,165,233,.1)}

.task{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid #1a2438;background:#0d121f;border-radius:18px;margin-bottom:10px}
.task.dn{border-left:4px solid #22c55e;background:#04100b;border-color:#123a2a;border-left-color:#22c55e}
.ti{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;background:#162035}
.task .tx{flex:1;min-width:0}.task b{font-size:15px;font-weight:700;display:block;line-height:1.2}
.task a{display:block;color:var(--cy);text-decoration:none;font-size:13px;margin:2px 0 4px}
.rw{display:flex;gap:12px;align-items:center;font-size:13px;font-weight:700;color:var(--cy)}
.rw span{display:flex;align-items:center;gap:4px}.rw .e{color:var(--eth)}
.rw img{width:16px;height:16px;border-radius:50%;background:#1d1d28;padding:2px;object-fit:contain}
.bt{border:0;border-radius:99px;padding:9px 20px;font:700 14px Inter,sans-serif;cursor:pointer;background:#fff;color:#000}
.bt.g{background:#22c55e;color:#fff}
.foot{text-align:center;color:#8a8fa6;font-size:13px;line-height:1.45;margin:10px 8px 18px}

.big{font-size:36px;font-weight:800}.big i{font-style:normal;color:var(--cy)}
.lab{font-size:12px;font-weight:700;letter-spacing:1.4px;color:var(--mut)}
.lk{display:flex;align-items:center;gap:12px;background:#0c0d14;border:1px solid #1c1d2a;border-radius:18px;padding:12px;margin:12px 0;color:var(--mut);font-size:13px}
.lk span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-family:monospace}
.lk em{width:40px;height:40px;border-radius:12px;background:#1b1c26;display:grid;place-items:center;color:#cfd3e6;cursor:pointer}
.ab{display:flex;align-items:center;justify-content:center;gap:9px;height:50px;border:0;border-radius:18px;font:700 16px Inter,sans-serif;color:#fff;background:#2b2b40;cursor:pointer}
.ab.c{background:linear-gradient(180deg,#38bdf8,#0ea5e9);box-shadow:0 0 24px rgba(14,165,233,.45);color:#000}

.st{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:16px 6px}
.st>div+div{border-left:1px solid #17243a}
.st .t{width:46px;height:46px;border-radius:14px;background:#0d2233;margin:0 auto 8px;display:grid;place-items:center;color:var(--cy)}
.st .t img{width:26px;height:26px;object-fit:contain}
.st b{font-size:26px;font-weight:800;display:block}.st small{color:#9aa0b8;font-size:12px}

.wb{text-align:center;padding:24px 12px}.wb .lab{letter-spacing:2px}.wb .big{margin:8px 0 4px;font-size:38px}.wb .u{color:var(--ok);font-size:16px}
.wd{width:100%;height:56px;border:0;border-radius:20px;background:var(--cy);color:#000;font:800 18px Inter,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;margin-bottom:20px}
.yw{color:#9aa0b8;font-size:16px;margin:0 0 10px 2px}
.wi{display:flex;align-items:center;gap:14px;padding:14px;background:#0d121f;border:1px solid #1a2438;border-radius:18px;margin-bottom:10px}
.wi .wl{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
.wi .tx{flex:1}.wi b{font-size:16px;white-space:nowrap;font-weight:700;display:block}.wi small{color:var(--eth);font-size:12px;font-family:monospace}
.wi button{background:none;border:0;color:var(--cy);font:700 15px Inter,sans-serif;cursor:pointer}

/* ADMIN PANEL STYLES */
.adm-group{margin-bottom:14px}
.adm-group label{display:block;font-size:11px;font-weight:800;color:var(--cy);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}
.adm-group input, .adm-group select{width:100%;background:#131828;border:1px solid #1e2942;padding:12px 14px;border-radius:12px;color:#fff;font-size:13.5px;outline:none}
.adm-group input:focus, .adm-group select:focus{border-color:var(--cy)}
.adm-section-title{font-size:13px;font-weight:900;color:var(--accent-yellow);margin:18px 0 10px;padding-bottom:4px;border-bottom:1px solid rgba(245,166,35,0.3);text-transform:uppercase}

/* nav */
nav{display:flex;gap:4px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:rgba(5,6,11,.95);border-top:1px solid #0e1623;position:relative;z-index:5}
nav button{flex:1;border:0;background:none;color:#8b8fa6;font:600 14px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;border-radius:20px;position:relative;cursor:pointer}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--cy);background:#0b2236}
nav button .dot{position:absolute;top:4px;right:26%;width:10px;height:10px;border-radius:50%;background:#f43f5e;border:2px solid var(--bg)}
nav button span{font-size:12px}

/* language bar */
#v-tap{position:relative}
.langs{position:absolute;right:6px;top:150px;display:flex;flex-direction:column;gap:6px;z-index:20}
.langs button{width:38px;height:24px;border-radius:99px;border:1px solid #2c3a57;background:#0b1220;color:#cfd3e6;font:700 10px Inter,sans-serif;cursor:pointer;padding:0}
.langs button.on{border-color:var(--cy);color:var(--cy);background:#0b2236}

/* splash */
#splash{position:fixed;inset:0;background:#0f0f11;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300;transition:opacity .3s,visibility .3s}
#splash.off{opacity:0;visibility:hidden}
.sp-wrap{position:relative;width:150px;height:150px;display:grid;place-items:center}
.sp-ring{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(#d4d7e2 0deg 9deg,transparent 9deg 15deg);-webkit-mask:radial-gradient(circle,transparent 60%,#000 62%);mask:radial-gradient(circle,transparent 60%,#000 62%);animation:spin 1s linear infinite}
.sp-logo{position:relative;width:92px;height:92px;border-radius:50%;background:#111116;padding:8px;object-fit:contain}
.sp-name{margin-top:22px;color:#6b6f80;font-size:18px;font-weight:700;letter-spacing:4px}
@keyframes spin{to{transform:rotate(360deg)}}

/* modal */
#mc-a,#ww{font-style:italic}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}
.mo.on{display:flex}
.sh{width:100%;max-width:440px;max-height:92vh;overflow:auto;background:#090d18;border:1.5px solid #14527a;border-radius:26px;padding:20px;box-shadow:0 0 40px rgba(14,165,233,.25);position:relative}
.mh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mh .wl{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.mh h3{font-size:24px;font-weight:800}.mh p{color:#b7bbd0;font-size:14px}
.x{margin-left:auto;width:38px;height:38px;border-radius:50%;background:#1e2438;border:0;color:#cfd3e6;display:grid;place-items:center;cursor:pointer;flex:none}
.sh .cap{color:#b7bbd0;font-size:13px;letter-spacing:1px;text-transform:uppercase;line-height:1.4;margin:14px 0 10px}
input{width:100%;background:#141829;border:1.5px solid var(--cy2);border-radius:16px;padding:16px;color:#fff;font:500 15px Inter,sans-serif;outline:0;margin-bottom:12px;user-select:text}
input::placeholder{color:#8b8fa6}
.cb{width:100%;height:54px;border:0;border-radius:18px;background:#35b9f6;color:#000;font:800 17px Inter,sans-serif;cursor:pointer}

.um{display:flex;align-items:center;gap:14px;margin:6px 0 16px}
.um .av{width:50px;height:50px;font-size:20px}.um b{font-size:18px;display:block}.um small{color:#b7bbd0;font-size:13px;display:block;font-family:monospace}.um em{font-style:normal;color:var(--ok);font-weight:600;font-size:14px}
.tb{border:1.5px solid #17446a;background:linear-gradient(180deg,#071c2e,#06111d);border-radius:22px;text-align:center;padding:20px 10px;margin-bottom:16px}
.tb .lab{letter-spacing:3px;font-weight:600;font-size:11px}.tb .big{font-size:36px;margin:6px 0}.tb .big i{color:var(--eth)}.tb .u{color:var(--ok);font-size:17px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.acts button{height:76px;border-radius:18px;border:1.5px solid #17446a;background:#050912;color:#fff;font:700 15px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.as{border:1px solid #17446a;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px;background:#070d1a}
.as .eth{width:40px;height:40px}.as div.l{flex:1}.as b{font-size:17px;display:block}.as small{color:#9aa0b8;font-size:13px}
.as div.r{text-align:right}.as div.r b{font-size:17px}.as div.r small{color:var(--ok)}

.dayg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.dayg div{border:1.5px solid #17324d;border-radius:14px;padding:10px 4px;text-align:center;font-size:11px;color:var(--mut);background:#070c17}
.dayg div b{display:block;font-size:15px;color:#fff;margin-top:3px}
.dayg .c{background:#0b2f4a;border-color:var(--cy);color:#fff}.dayg .t{border-color:var(--cy)}

.qr-box{background:#ffffff;padding:12px;border-radius:18px;width:180px;height:180px;margin:12px auto;display:flex;align-items:center;justify-content:center}
.qr-box img{width:100%;height:100%}

.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.92);opacity:0;visibility:hidden;pointer-events:none;background:#1a1c2e;border:1px solid #2a3a55;padding:20px 26px;border-radius:22px;font-size:18px;font-weight:700;line-height:1.4;z-index:200;transition:opacity .25s,transform .25s,visibility .25s;width:max-content;max-width:86vw;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.85)}
.toast.on{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
